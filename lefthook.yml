# Git hooks (Lefthook). One-time setup per clone: `bunx lefthook install`.
# Run manually any time: `bunx lefthook run pre-push`.

pre-push:
  jobs:
    - name: env-check
      run: node scripts/check-env.mjs
      # Every process.env.X / import.meta.env.VITE_X referenced in code
      # must be documented in .env.example (placeholders only, never secrets).

    - name: secrets-scan
      run: node scripts/scan-secrets.mjs
      # Staged changes must not contain real env files, JWTs, private keys,
      # credentialed DB URLs, or live secret prefixes.

    - name: encoding
      run: node scripts/check-encoding.mjs
      # Catches mojibake from a Windows-1252 round trip through PowerShell,
      # which silently mangles every non-ASCII character in a file.

    - name: typecheck-frontend
      run: bun run --cwd frontend typecheck

    - name: typecheck-backend
      run: bun run --cwd backend typecheck
      # Both typechecks are clean. backend/src/lib/twenty-client.ts used to be
      # excluded here for pre-existing errors; those are fixed, so it is gated.

    - name: deploy-railcode
      root: railcode/offer-builder
      run: railcode deploy
      timeout: 10m
      glob:
        - 'railcode/offer-builder/**'
        - 'lefthook.yml'
      # The Railcode port must stay in sync with the app: any push touching
      # it deploys to the live app so drift can't ship unnoticed. Needs the
      # local railcode CLI authenticated (railcode login).
